<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Everything at your fingertips — 3D hand hero</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(60% 45% at 50% 12%, rgba(168,85,247,0.14) 0%, transparent 70%),
        radial-gradient(50% 40% at 78% 88%, rgba(236,72,153,0.10) 0%, transparent 70%),
        radial-gradient(120% 80% at 50% 0%, #14091f 0%, #08060f 55%, #05040a 100%);
      color: #eaeaf0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }
    .canvas-wrap { position: absolute; inset: 0; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    .content {
      position: absolute; inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 9vh 6vw 6vh;
      text-align: center;
      pointer-events: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      font: 500 11px/1 'Inter', sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #cfd0e0;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .pill .dot {
      width: 6px; height: 6px; border-radius: 999px;
      background: #a855f7;
      box-shadow: 0 0 12px #a855f7;
    }

    h1 {
      margin: 22px 0 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: clamp(40px, 7.2vw, 88px);
      line-height: 1.02;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff 0%, #b8b8c8 100%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
    }
    h1 .accent {
      background: linear-gradient(120deg, #c084fc 0%, #ec4899 100%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
    }

    p.lead {
      margin: 0 auto;
      max-width: 620px;
      font-size: clamp(15px, 1.4vw, 17px);
      line-height: 1.55;
      color: rgba(230,230,240,0.66);
    }

    .cta {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 26px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font: 600 15px/1 'Inter', sans-serif;
      letter-spacing: -0.005em;
      color: #ffffff;
      cursor: pointer;
      text-decoration: none;
      transition: transform .35s cubic-bezier(.2,.9,.3,1),
                  border-color .35s cubic-bezier(.2,.9,.3,1),
                  box-shadow .35s cubic-bezier(.2,.9,.3,1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.14);
    }
    .cta:focus-visible {
      outline: none;
      border-color: rgba(168,85,247,0.7);
      box-shadow: 0 0 0 4px rgba(168,85,247,0.25), 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.14);
    }
    .cta:hover {
      transform: translateY(-2px);
      border-color: rgba(168,85,247,0.55);
      box-shadow: 0 26px 60px rgba(168,85,247,0.30), inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .cta .arrow { transition: transform .35s cubic-bezier(.2,.9,.3,1); }
    .cta:hover .arrow { transform: translateX(4px); }

    .mini {
      position: absolute;
      bottom: 22px; left: 26px;
      z-index: 3;
      font: 500 10px/1 'Inter', sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(230,230,240,0.35);
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .content { padding: 7vh 5vw 5vh; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="canvas-wrap"><canvas id="scene" aria-hidden="true"></canvas></div>

    <div class="content">
      <div class="top">
        <span class="pill"><span class="dot"></span>New · Now shipping</span>
        <h1>Everything at your<br /><span class="accent">fingertips</span>.</h1>
        <p class="lead">Craft, ship, and grow — all in one place. A premium landing that reacts to every move.</p>
      </div>

      <a href="#" id="cta" class="cta" aria-describedby="cta-hint">
        Get Started <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>

    <div class="mini">© 2026 · Studio Demo</div>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.161.0"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ── Renderer ─────────────────────────────────────────────────────────────
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // ── Scene / camera ───────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x08060f, 14, 26);

    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
    camera.position.set(0, 0.35, 7.2);
    camera.lookAt(0, 0.05, 0);

    // ── Lights: soft studio setup (key + fill + rim + accents) ───────────────
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    const key = new THREE.DirectionalLight(0xffffff, 1.7);
    key.position.set(4.2, 6, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.radius = 6;
    key.shadow.bias = -0.0006;
    key.shadow.camera.left = -3; key.shadow.camera.right = 3;
    key.shadow.camera.top = 3; key.shadow.camera.bottom = -3.5;
    key.shadow.camera.near = 0.5; key.shadow.camera.far = 20;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xa1c4fd, 0.55);
    fill.position.set(-4, 2, 3);
    scene.add(fill);

    const rim = new THREE.PointLight(0xec4899, 3.2, 14, 2);
    rim.position.set(-2.2, 3, -4);
    scene.add(rim);

    const accent = new THREE.PointLight(0x8b5cf6, 2.6, 16, 2);
    accent.position.set(3.2, -1.2, -3);
    scene.add(accent);

    // Contact-shadow floor (invisible surface that only catches shadow).
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.ShadowMaterial({ opacity: 0.42 }),
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -2.6;
    floor.receiveShadow = true;
    scene.add(floor);

    // ── Materials ────────────────────────────────────────────────────────────
    const skin = new THREE.MeshPhysicalMaterial({
      color: 0xf3c6a2,
      roughness: 0.5,
      clearcoat: 0.32,
      clearcoatRoughness: 0.6,
      sheen: 0.4,
      sheenColor: new THREE.Color(0xffc4a8),
      sheenRoughness: 0.9,
      reflectivity: 0.25,
    });

    // ── Hand construction ────────────────────────────────────────────────────
    const hand = new THREE.Group();
    hand.position.y = -0.15;
    scene.add(hand);

    // Palm — an ellipsoid gives a rounded, claymorphism-friendly shape.
    const palmGeom = new THREE.SphereGeometry(0.86, 44, 30);
    palmGeom.scale(1.05, 1.1, 0.44);
    const palm = new THREE.Mesh(palmGeom, skin);
    palm.castShadow = true; palm.receiveShadow = true;
    hand.add(palm);

    // Wrist / forearm stub behind the palm.
    const wrist = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.58, 1.0, 32), skin);
    wrist.position.set(0, -1.15, -0.02);
    wrist.castShadow = true; wrist.receiveShadow = true;
    hand.add(wrist);

    // Finger builder — each segment is a capsule; joints are Groups that rotate
    // around their local X-axis (like a real knuckle bending).
    function makeFinger(segments) {
      const joints = [];
      const root = new THREE.Group();
      let parent = root;
      for (let i = 0; i < segments.length; i++) {
        const seg = segments[i];
        const joint = new THREE.Group();
        const capsule = new THREE.Mesh(
          new THREE.CapsuleGeometry(seg.radius, seg.len, 8, 16),
          skin,
        );
        capsule.position.y = seg.len / 2 + seg.radius;
        capsule.castShadow = true; capsule.receiveShadow = true;
        joint.add(capsule);
        parent.add(joint);
        const next = new THREE.Group();
        next.position.y = seg.len + seg.radius * 2;
        joint.add(next);
        joints.push({ joint });
        parent = next;
      }
      // Fingertip cap so the last segment reads as rounded.
      const tipRadius = segments[segments.length - 1].radius * 0.95;
      const tip = new THREE.Mesh(new THREE.SphereGeometry(tipRadius, 20, 14), skin);
      tip.castShadow = true; tip.receiveShadow = true;
      parent.add(tip);
      return { root, joints };
    }

    function attachFinger(pos, rot, def, baseCurl) {
      const f = makeFinger(def);
      f.root.position.copy(pos);
      f.root.rotation.set(rot.x, rot.y, rot.z);
      hand.add(f.root);
      f.joints.forEach((j, i) => (j.joint.rotation.x = -baseCurl[i]));
      return f;
    }

    // 4 long fingers arranged along the palm's top edge, thumb angled out on the left.
    const indexF = attachFinger(
      new THREE.Vector3(-0.52, 0.82, 0.05),
      { x: 0, y: 0, z: 0.04 },
      [{ len: 0.44, radius: 0.14 }, { len: 0.36, radius: 0.125 }, { len: 0.30, radius: 0.11 }],
      [0.30, 0.50, 0.55],
    );
    const midF = attachFinger(
      new THREE.Vector3(-0.17, 0.86, 0.05),
      { x: 0, y: 0, z: 0.0 },
      [{ len: 0.50, radius: 0.145 }, { len: 0.40, radius: 0.13 }, { len: 0.32, radius: 0.115 }],
      [0.30, 0.50, 0.55],
    );
    const ringF = attachFinger(
      new THREE.Vector3(0.18, 0.84, 0.05),
      { x: 0, y: 0, z: -0.04 },
      [{ len: 0.44, radius: 0.14 }, { len: 0.36, radius: 0.125 }, { len: 0.30, radius: 0.11 }],
      [0.32, 0.52, 0.55],
    );
    const pinkyF = attachFinger(
      new THREE.Vector3(0.50, 0.74, 0.05),
      { x: 0, y: 0, z: -0.16 },
      [{ len: 0.34, radius: 0.115 }, { len: 0.26, radius: 0.105 }, { len: 0.22, radius: 0.095 }],
      [0.38, 0.58, 0.60],
    );
    const thumb = attachFinger(
      new THREE.Vector3(-0.72, 0.02, 0.18),
      { x: 0, y: 0.15, z: 1.05 },
      [{ len: 0.42, radius: 0.155 }, { len: 0.30, radius: 0.13 }],
      [0.15, 0.35],
    );

    // ── Interaction state ────────────────────────────────────────────────────
    const state = {
      mouseX: 0, mouseY: 0,
      targetRotY: 0, targetRotX: 0,
      pose: 'relax',
    };

    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const lerp = (a, b, t) => a + (b - a) * t;

    window.addEventListener('pointermove', (e) => {
      state.mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      state.mouseY = (e.clientY / window.innerHeight) * 2 - 1;
    }, { passive: true });

    const cta = document.getElementById('cta');
    const setPoint = () => (state.pose = 'point');
    const setRelax = () => (state.pose = 'relax');
    cta.addEventListener('pointerenter', setPoint);
    cta.addEventListener('pointerleave', setRelax);
    cta.addEventListener('focus', setPoint);
    cta.addEventListener('blur', setRelax);

    // Curl per finger for each pose (proximal → distal).
    const poses = {
      relax: {
        index: [0.30, 0.50, 0.55],
        mid:   [0.30, 0.50, 0.55],
        ring:  [0.32, 0.52, 0.55],
        pinky: [0.38, 0.58, 0.60],
        thumb: [0.15, 0.35],
        handTiltX: 0,
        handTwistZ: 0,
      },
      point: {
        // Index extended nearly straight, three fingers curled tight, thumb tucked.
        index: [-0.08, 0.02, 0.05],
        mid:   [1.40, 1.55, 1.35],
        ring:  [1.40, 1.55, 1.35],
        pinky: [1.35, 1.55, 1.35],
        thumb: [0.70, 0.90],
        handTiltX: -0.28,   // lean the whole hand forward, as if pointing at the CTA
        handTwistZ: -0.06,
      },
    };

    function applyPose(finger, target, t) {
      for (let i = 0; i < finger.joints.length; i++) {
        const j = finger.joints[i];
        j.joint.rotation.x = lerp(j.joint.rotation.x, -target[i], t);
      }
    }

    // ── Animation loop ───────────────────────────────────────────────────────
    let time = 0;
    const clock = new THREE.Clock();

    function tick() {
      const dt = Math.min(0.06, clock.getDelta());
      time += dt;

      // Frame-rate independent lerp weight — same feel at any FPS.
      const t = 1 - Math.pow(0.001, dt);

      // Parallax targets (clamped so the hand never whips).
      state.targetRotY = clamp(state.mouseX * 0.55, -0.55, 0.55);
      state.targetRotX = clamp(-state.mouseY * 0.32, -0.4, 0.4);

      const pose = poses[state.pose];

      // Idle drift + parallax + pose tilt combined.
      const idleX = Math.sin(time * 1.1) * 0.025;
      const idleZ = Math.sin(time * 0.72) * 0.03;
      hand.rotation.y = lerp(hand.rotation.y, state.targetRotY, t * 0.85);
      hand.rotation.x = lerp(hand.rotation.x, state.targetRotX + idleX + pose.handTiltX, t * 0.75);
      hand.rotation.z = lerp(hand.rotation.z, idleZ + pose.handTwistZ, t * 0.6);
      hand.position.y = lerp(hand.position.y, -0.15 + Math.sin(time * 1.35) * 0.06, t * 0.9);

      // Ease every joint toward the pose's target curl.
      const poseEase = t * 0.55;
      applyPose(indexF, pose.index, poseEase);
      applyPose(midF,   pose.mid,   poseEase);
      applyPose(ringF,  pose.ring,  poseEase);
      applyPose(pinkyF, pose.pinky, poseEase);
      applyPose(thumb,  pose.thumb, poseEase);

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    // ── Resize ───────────────────────────────────────────────────────────────
    function resize() {
      const w = canvas.clientWidth || window.innerWidth;
      const h = canvas.clientHeight || window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    requestAnimationFrame(tick);
  </script>
</body>
</html>
